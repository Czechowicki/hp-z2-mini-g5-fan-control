PACKAGE_NAME="hp_smm_fan"
PACKAGE_VERSION="1.1.1"
BUILT_MODULE_NAME[0]="hp_smm_fan"
DEST_MODULE_LOCATION[0]="/extra"
AUTOINSTALL="yes"
BUILD_EXCLUSIVE_ARCH="^x86_64$"
BUILD_EXCLUSIVE_KERNEL="^6[.]8[.]0-(149|1[5-9][0-9]|[2-9][0-9][0-9]|[1-9][0-9]{3,})-generic$"
MAKE[0]="make -j2 -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
