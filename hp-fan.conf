# CPU fan curve - HP Z2 Mini G5 (hp-fan daemon).
# Format: "temperature_C  minimum_%" (one pair per line). Blank lines and # ignored.
# The daemon interpolates linearly between points. "minimum %" is a floor the
# firmware AUTO control may exceed upward, but never drop below.
#
# CHANGES APPLY AUTOMATICALLY within a few seconds - no restart needed.
# (rough guide: 20% ~ 1100-1400 RPM, top end ~4800; tune to taste)

50   20     # <=50 C: quiet at idle
60   35
70   52
80   72
87   90
93  100     # >=93 C: maximum (before the 100 C throttle point)
